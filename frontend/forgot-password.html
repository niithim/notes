<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Notes - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Secure Notes</h2>
                        <h4 class="text-center mb-4 text-muted">Reset Password</h4>
                        
                        <!-- Alert messages -->
                        <div id="alertContainer"></div>

                        <!-- Step 1: Request Reset Token -->
                        <div id="requestTokenStep">
                            <p class="text-muted mb-4">Enter your email address to receive a password reset token.</p>
                            <form id="forgotPasswordForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 mb-3">Generate Reset Token</button>
                            </form>
                        </div>

                        <!-- Step 2: Reset Password -->
                        <div id="resetPasswordStep" style="display: none;">
                            <p class="text-muted mb-4">Enter the reset token and your new password.</p>
                            <form id="resetPasswordForm">
                                <div class="mb-3">
                                    <label for="token" class="form-label">Reset Token</label>
                                    <input type="text" class="form-control" id="token" required>
                                </div>
                                <div class="mb-3">
                                    <label for="newPassword" class="form-label">New Password</label>
                                    <input type="password" class="form-control" id="newPassword" required minlength="6">
                                    <small class="form-text text-muted">Minimum 6 characters</small>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 mb-3">Reset Password</button>
                            </form>
                        </div>

                        <hr>
                        <div class="text-center">
                            <a href="index.html" class="text-decoration-none">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
